spring.application.name=api_torneos_mysql

# ==========================================
# MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/api_torneos_mysql?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# ==========================================
# LOGS
# ==========================================
logging.level.com.angel.api_torneos_mysql=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO